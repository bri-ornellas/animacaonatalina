<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>NatalIF de Bireguas</title>
        <script
            src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>
    <body>
        <header
            class="flex h-[15vh] bg-linear-to-r from-red-200 to-green-500 items-center justify-evenly">
            <div class="w-[40%] flex justify-center"><span
                    class="font-[Trebuchet_MS] text-[50px] font-bold">🎄 NatalIF
                    🎄</span></div>
            <nav
                class="flex w-[60%] justify-evenly font-[Arial] text-white font-[700] [&_a]:bg-blue-500 [&_a]:p-[8px] [&_a]:rounded-[20px] [&_a]:hover:text-yellow-600 [&_a]:hover:bg-cyan-700 [&_a]:transition-all [&_a]:duration-1000">
                <a href class>Início</a><a href>Sobre</a><a href>Eventos</a><a
                    href>Equipe</a><a href>Para você</a>
            </nav>
        </header>
        <hr>
        <main class="flex h-[70vh] bg-yellow-200 flex-wrap">
            <div class="flex w-[100%] h-[25%]">
                <span>
                    <h1 class="text-[20px] font-[600] p-[20px]">O Instituto
                        Federal de Educação, Ciência e Tecnologia de São Paulo -
                        Câmpus Birigui deseja boas festas e um Feliz Natal a
                        você!</h1>
                </span>
            </div>
            <div
                class="flex w-[100%] h-[75%] bg-rose-200 perspective-[200px] relative">
                <div class></div>
                <div
                    class="w-[200px] h-[200px] absolute left-[600px] self-end animate-pulse"><img
                        src="https://images.vexels.com/media/users/3/195516/isolated/preview/2b1dad31b08a90c8894a5a30db207297-caixa-de-presente-de-natal-colorida.png"
                        alt></div>
                <div class="w-[400px] h-[300px] bg-emerald-800
                -skew-x-1 scale-x-90 rotate-1
                [clip-path:polygon(50%_0%,15%_30%,40%_28%,5%_60%,42%_55%,0%_85%,45%_85%,43%_100%,57%_100%,55%_85%,100%_85%,62%_58%,90%_63%,60%_32%,80%_35%)] absolute left-[50px] top-[100px] z-2"></div>
                <div
                    class="h-[300px] w-[25px] bg-yellow-800 self-end absolute left-[232px] z-1"></div>
            </div>
        </main>
        <hr>
        <foote class="flex h-[14.8vh] bg-[grey]">

        </footer>
    </body>
</html>
